{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block title %}Add Prescription - {{ patient.full_name }}{% endblock %}

{% block content %}
<div class="container-fluid p-0" style="max-width: 650px;">
    <div class="d-flex align-items-center gap-2 mb-3">
        <a href="{% url 'patients:patient_detail' patient.pk %}" class="btn btn-light btn-sm rounded-circle"><i class="bi bi-arrow-left"></i></a>
        <h4 class="fw-bold mb-0">Add Prescription</h4>
    </div>
    <div class="card border-0 shadow-sm p-4">
        <p class="text-muted small mb-3">Patient: <strong>{{ patient.full_name }}</strong> ({{ patient.patient_code }})</p>
        <form method="POST">
            {% csrf_token %}
            {{ form|crispy }}
            <div class="d-flex justify-content-end gap-2 mt-3">
                <a href="{% url 'patients:patient_detail' patient.pk %}" class="btn btn-light">Cancel</a>
                <button type="submit" class="btn btn-primary"><i class="bi bi-capsule me-1"></i> Prescribe Medicine</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
