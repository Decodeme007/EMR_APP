{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Sign In - TLC Rehab Manager{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 75vh;">
    <div class="col-12 col-sm-8 col-md-5 col-lg-4">
        <div class="card shadow-sm p-4 border-0">
            <div class="text-center mb-4">
                <div class="bg-primary text-white rounded-circle d-inline-flex align-items-center justify-content-center mb-2" style="width: 50px; height: 50px;">
                    <i class="bi bi-heart-pulse-fill fs-4"></i>
                </div>
                <h4 class="fw-bold mb-1">TLC Rehab EMR</h4>
                <p class="text-muted small">Multi-tenant clinical management system</p>
            </div>

            <form method="POST">
                {% csrf_token %}
                {{ form|crispy }}
                <button type="submit" class="btn btn-primary w-100 mt-3 py-2 fw-semibold">
                    <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
